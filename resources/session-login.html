<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNIPER — восстановление Telegram</title>
<style nonce="__NONCE__">
body{font:17px system-ui;margin:0;background:#101318;color:#f5f7fa}main{max-width:480px;margin:auto;padding:30px 22px}h1{font-size:27px}p{line-height:1.55;color:#c3cad4}label{display:block;margin-bottom:10px}input,button{box-sizing:border-box;width:100%;padding:15px;border-radius:12px;font:inherit;margin-bottom:14px}input{background:#1d2530;color:white;border:1px solid #536071}button{background:#b6ff65;color:#101318;border:0;font-weight:650}button:disabled{opacity:.5}#status{white-space:pre-wrap}small{color:#a7b1bf}form[hidden]{display:none}
</style>
<main>
<h1>Восстановление Telegram</h1>
<p>Подключаем аккаунт к существующему SNIPER. Введённые данные отправляются только на этот сервер.</p>
<p id="status" role="status">Проверяю сессию и постоянное хранение…</p>
<form id="login" hidden>
<label id="label" for="value"></label>
<input id="value" required>
<button id="submit">Продолжить</button>
</form>
<button id="refresh">Проверить снова</button>
<small>Не пересылай код или пароль в чат. Если страница сообщает об отсутствии диска, сначала подключи его в Railway.</small>
</main>
<script nonce="__NONCE__">
'use strict';
const csrf='__CSRF__', form=document.querySelector('#login'), field=document.querySelector('#value'), status=document.querySelector('#status'), refresh=document.querySelector('#refresh'), submit=document.querySelector('#submit');
let action='',busy=false;
const errors={PERSISTENT_VOLUME_REQUIRED:'Вход пока закрыт: в Railway нужен постоянный диск с путём /app/sessions.',SERVER_AUTH_REQUIRED:'Нужны логин и пароль защиты этого сервера. Обнови страницу и введи их в окно Safari.',RELOAD_LOGIN_PAGE:'Обнови страницу: время защищённой формы истекло.',PHONE_CODE_INVALID:'Код неверный. Если снова показан номер телефона, запроси новый код через минуту.',PHONE_CODE_EXPIRED:'Код истёк. Нужен новый вход.',PASSWORD_HASH_INVALID:'Пароль двухэтапной проверки неверный.',PHONE_NUMBER_INVALID:'Проверь номер в международном формате, например +7…',PHONE_NUMBER_BANNED:'Telegram заблокировал этот номер.',AUTH_KEY_UNREGISTERED:'Старая сессия недействительна. Требуется восстановление сессии на сервере.',ALREADY_LOGGED_IN:'Аккаунт уже подключён. Нажми «Проверить снова».',WAIT_60_SECONDS:'Подожди минуту перед повторным запросом кода.',REGISTRATION_NOT_SUPPORTED:'Эта страница подключает существующий аккаунт. Регистрация нового аккаунта не поддерживается.'};
function show(data){
 if(data.error){if(data.state)show({state:data.state});status.textContent=errors[data.error]||(data.error.startsWith('FLOOD_WAIT_')?'Telegram ограничил запросы. Подожди '+data.error.slice(11)+' секунд.':'Не удалось завершить вход. Попробуй проверить состояние снова.');return;}
 form.hidden=true;field.value='';
 const configs={PHONE_REQUIRED:['phone','Номер Telegram в международном формате','tel','tel','tel'],CODE_REQUIRED:['code','Код из сообщения Telegram','text','numeric','one-time-code'],PASSWORD_REQUIRED:['password','Пароль двухэтапной проверки Telegram','password','text','off']};
 if(configs[data.state]){const c=configs[data.state];action=c[0];document.querySelector('#label').textContent=c[1];field.type=c[2];field.inputMode=c[3];field.autocomplete=c[4];form.hidden=false;status.textContent=action==='phone'?'Сессия не подключена. Запроси код на свой номер.':action==='code'?'Код отправлен. Открой Telegram и вернись сюда.':'Telegram запросил пароль двухэтапной проверки.';}
 else status.textContent=data.state==='LOGGED_IN'?'Telegram подключён. Сессия сохранена на постоянном диске. Теперь можно проверить чтение источников в Make.':errors[data.state]||'Неизвестное состояние сессии.';
}
async function request(payload){
 if(busy)return;busy=true;submit.disabled=true;refresh.disabled=true;
 try{const res=await fetch(payload?'/session-login':'/session-login/state',{method:payload?'POST':'GET',credentials:'same-origin',cache:'no-store',headers:payload?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:payload?JSON.stringify(payload):undefined});show(await res.json());}
 catch{status.textContent='Сервер не ответил. Подожди немного и нажми «Проверить снова».';}
 finally{busy=false;submit.disabled=false;refresh.disabled=false;}
}
form.addEventListener('submit',event=>{event.preventDefault();const value=action==='password'?field.value:field.value.trim();field.value='';request({action,value});});
refresh.addEventListener('click',()=>request());request();
</script>
</html>
